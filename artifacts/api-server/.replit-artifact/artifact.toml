kind = "api"
previewPath = "/api"
title = "RADIK AI BOT"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "RADIK AI BOT"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["sh", "-c", "node bot/telegram_bridge.mjs & while true; do uv run python bot/radik_bot.py; code=$?; echo \"RADIK bot exited with code $code, restarting in 5s\"; sleep 5; done"]

[services.production.run.env]
PORT = "8080"
API_PORT = "8080"
TELEGRAM_BRIDGE_PORT = "8010"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
